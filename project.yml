name: Screeny
options:
  bundleIdPrefix: dev.screeny
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.4.0
targets:
  Screeny:
    type: application
    platform: macOS
    sources:
      - Screeny
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Screeny/Resources/Info.plist
      properties:
        CFBundleDisplayName: Screeny
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "MIT License"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.screeny.Screeny
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ScreenyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ScreenyTests
    dependencies:
      - target: Screeny
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Screeny.app/Contents/MacOS/Screeny
schemes:
  Screeny:
    build:
      targets:
        Screeny: all
        ScreenyTests: [test]
    test:
      targets:
        - ScreenyTests
